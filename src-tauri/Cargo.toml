[package]
name = "su-knowledge-base"
version = "1.0.0"
description = "Su personal knowledge base"
authors = ["Su"]
edition = "2021"

[lib]
name = "su_knowledge_base_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
