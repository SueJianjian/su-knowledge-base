<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060810">
  <meta name="description" content="一个属于你的个人知识库，用来收藏、整理和连接值得保留的想法。">
  <title>私藏 // 个人知识库</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-grain" aria-hidden="true"></div>

  <div class="app-shell">
    <aside class="sidebar">
      <div>
        <a class="brand" href="#" aria-label="返回知识库首页">
          <span class="brand-mark">Su</span>
          <span>
            <strong>私藏</strong>
            <small>PERSONAL ARCHIVE</small>
          </span>
        </a>

        <button class="capture-button" id="open-composer" type="button">
          <span class="capture-plus">+</span>
          <span>记录一个想法</span>
          <kbd>N</kbd>
        </button>

        <nav class="category-nav" aria-label="知识分类">
          <div class="nav-heading">
            <span>知识地图</span>
            <span class="nav-rule"></span>
          </div>
          <div id="category-list"></div>
        </nav>

        <section class="category-manager" aria-label="自定义分类">
          <div class="manager-heading">
            <span>自定义分类</span>
            <span class="manager-count" id="custom-category-count">00</span>
          </div>
          <form class="category-form" id="category-form">
            <input id="category-input" type="text" maxlength="24" placeholder="输入新分类，回车保存">
            <button class="tag-add-button" type="submit">添加</button>
          </form>
          <div class="custom-category-list" id="custom-category-list"></div>
        </section>

        <section class="tag-manager" aria-label="标签库">
          <div class="manager-heading">
            <span>标签库</span>
            <span class="manager-count" id="custom-tag-count">00</span>
          </div>
          <form class="tag-form" id="tag-form">
            <input id="tag-input" type="text" maxlength="24" placeholder="输入新标签，回车保存">
            <button class="tag-add-button" type="submit">添加</button>
          </form>
          <p class="tag-manager-tip">点击标签可插入到正在编辑的笔记，右侧按钮可重命名或删除；新增的标签会同步到上方筛选栏。</p>
          <div class="custom-tag-list" id="custom-tag-list"></div>
        </section>
      </div>

      <div class="sidebar-footer">
        <div class="storage-status">
          <span class="status-dot"></span>
          <span>内容保存在本机浏览器</span>
        </div>
        <div class="data-actions">
          <button class="text-button" id="choose-folder" type="button">选择保存文件夹</button>
          <span>/</span>
          <button class="text-button" id="export-notes" type="button">导出备份</button>
          <span>/</span>
          <button class="text-button" id="import-notes" type="button">导入数据</button>
          <input id="import-file" type="file" accept="application/json" hidden>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb">
          <span class="breadcrumb-home">Su</span>
          <span>/</span>
          <span id="current-location">全部笔记</span>
        </div>
        <div class="topbar-meta">
          <span id="today-label"></span>
          <span class="topbar-divider"></span>
          <span class="edition-label">个人版 · 01</span>
        </div>
      </header>

      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">YOUR SECOND BRAIN</p>
          <h1>把值得记住的，<em>留下来。</em></h1>
          <p class="hero-description">想法不必在出现时就完整。先收集，再慢慢让它们彼此连接。</p>
        </div>
        <div class="hero-mark" aria-hidden="true">
          <span>01</span>
          <span>ARCHIVE</span>
        </div>
      </section>

      <section class="toolbar" aria-label="笔记工具栏">
        <label class="search-box">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="search-input" type="search" placeholder="搜索标题、正文或标签..." autocomplete="off">
          <kbd>⌘ K</kbd>
        </label>
        <div class="view-tools">
          <span class="result-count" id="result-count"></span>
          <button class="view-button active" type="button" aria-label="卡片视图">
            <span class="grid-icon" aria-hidden="true"></span>
          </button>
        </div>
      </section>

      <div class="tag-strip" id="tag-list" aria-label="标签筛选"></div>
      <section class="notes-grid" id="notes-grid" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="composer-modal" hidden>
    <section class="modal composer-modal" role="dialog" aria-modal="true" aria-labelledby="composer-title">
      <div class="modal-header">
        <div>
          <p class="eyebrow">QUICK CAPTURE</p>
          <h2 id="composer-title">记录一个想法</h2>
        </div>
        <button class="close-button" data-close-modal type="button" aria-label="关闭">×</button>
      </div>
      <form id="note-form">
        <input id="note-id" type="hidden">
        <div class="form-row">
          <label class="field">
            <span>标题</span>
            <input id="note-title" type="text" placeholder="这条笔记想说什么？" required maxlength="100">
          </label>
          <label class="field field-small">
            <span>归入</span>
            <select id="note-category"></select>
          </label>
        </div>
        <label class="field">
          <span>标签 <small>逗号、中文逗号都可以，也可先在左侧新增</small></span>
          <input id="note-tags" type="text" placeholder="例如：方法论, 阅读, 灵感">
        </label>
        <label class="field">
          <span>正文</span>
          <textarea id="note-content" rows="9" placeholder="写下当下的想法。不需要完美，真实就好。" required></textarea>
        </label>
        <label class="pin-check">
          <input id="note-pinned" type="checkbox">
          <span class="fake-checkbox"></span>
          <span>置顶这条笔记</span>
        </label>
        <div class="form-footer">
          <span class="form-tip">⌘ Enter 快速保存</span>
          <div class="form-actions">
            <button class="button button-quiet" data-close-modal type="button">取消</button>
            <button class="button button-primary" type="submit">保存笔记</button>
          </div>
        </div>
      </form>
    </section>
  </div>

  <div class="modal-backdrop" id="detail-modal" hidden>
    <section class="modal detail-modal" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="detail-topline">
        <span class="detail-category" id="detail-category"></span>
        <button class="close-button" data-close-modal type="button" aria-label="关闭">×</button>
      </div>
      <h2 id="detail-title"></h2>
      <div class="detail-meta">
        <span id="detail-date"></span>
        <span class="meta-separator">·</span>
        <span id="detail-read-time"></span>
        <span id="detail-pinned" class="pinned-label" hidden>已置顶</span>
      </div>
      <div class="detail-tags" id="detail-tags"></div>
      <div class="detail-content" id="detail-content"></div>
      <div class="detail-footer">
        <button class="text-button danger-button" id="delete-note" type="button">删除笔记</button>
        <button class="button button-primary" id="edit-note" type="button">编辑笔记</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
